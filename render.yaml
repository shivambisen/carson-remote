# Render Blueprint: one free web service running carson-server with the viewer bundled.
# Dashboard → New → Blueprint → this repository. You are asked for the three secret values
# (sync: false); everything else is set here. Data lives in PostgreSQL (e.g. Neon), since free
# Render services have no persistent disk.
#
# Relay: Render can't run one (it only exposes HTTP(S)), so set the Cloudflare TURN key below;
# without it, direct connections (most home and mobile networks) still work.
services:
  - type: web
    name: carson
    runtime: docker
    plan: free
    region: ohio # next to a Neon us-east-2 database: ~1 ms per query
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CARSON_DEV
        value: "false"
      - key: CARSON_PUBLIC_URL
        value: https://app.glenley.in
      - key: CARSON_TRUST_PROXY
        value: "true"
      - key: CARSON_TURN_SECRET
        generateValue: true
      - key: CARSON_STUN_URLS
        value: stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302
      - key: CARSON_DATABASE_URL
        sync: false
      - key: CARSON_GOOGLE_CLIENT_ID
        sync: false
      - key: CARSON_GOOGLE_CLIENT_SECRET
        sync: false
      # One-time ₹99 purchase (Razorpay). Leave empty to run without payments.
      - key: CARSON_RAZORPAY_KEY_ID
        sync: false
      - key: CARSON_RAZORPAY_KEY_SECRET
        sync: false
      - key: CARSON_RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Relay for networks that block direct connections (campus, office): Cloudflare TURN.
      - key: CARSON_CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CARSON_CLOUDFLARE_TURN_TOKEN
        sync: false

  # Landing page (glenley.in). Served from Render's Cloudflare edge like app.glenley.in, because
  # some campus and ISP networks cut off connections to Vercel-hosted custom domains.
  - type: web
    name: glenley-site
    runtime: static
    rootDir: site
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    domains:
      - glenley.in
      - www.glenley.in
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

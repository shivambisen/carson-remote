[package]
name = "carson-agent"
description = "carson host agent: screen capture, encoding and input injection."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
carson-capture = { version = "0.1.0", path = "../carson-capture" }
carson-encode = { version = "0.1.0", path = "../carson-encode" }
carson-proto = { path = "../carson-proto" }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rtc = { version = "0.21.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
webrtc = "0.21.1"

[lints]
workspace = true

# Device private key storage: OS keychain on macOS/Windows. Linux uses a 0600 file
# until packaging (M8) adds Secret Service, which needs a running desktop session.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[workspace]
resolver = "3"
members = ["crates/carson-agent", "crates/carson-proto", "crates/carson-capture", "crates/carson-encode"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Video work is unusable unoptimized: build dependencies and the media crates with
# optimizations even in dev, keeping fast incremental builds for the rest.
[profile.dev.package."*"]
opt-level = 2
debug = false # dependency debug info is most of target/'s size

[profile.dev.package.carson-capture]
opt-level = 2

[profile.dev.package.carson-encode]
opt-level = 2

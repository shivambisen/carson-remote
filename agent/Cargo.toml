[workspace]
resolver = "3"
members = ["crates/carson-agent", "crates/carson-proto", "crates/carson-capture", "crates/carson-encode"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

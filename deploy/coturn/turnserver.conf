# coturn for carson. Credentials are time-limited HMACs minted by carson-server
# (TURN REST API scheme); the shared secret is supplied via --static-auth-secret.
listening-port=3478
realm=carson
use-auth-secret
fingerprint
# Small relay range for local dev; widen in production and open it in the firewall.
min-port=49160
max-port=49200
# Only relay to public addresses: prevents using TURN to reach internal services (SSRF).
# For a LAN-only test setup (both peers on private IPs) these must be relaxed.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The CLI is off by default in coturn ≥ 4.8, where `no-cli` is rejected; keep it for 4.7 (pinned image).
no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log
# Behind NAT (e.g. cloud VM), set: external-ip=<public-ip>/<private-ip>
